[versions]

# Android toolchain
agp = "9.3.1"
android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "37"
build-tools = "36.0.0"
ndk = "29.0.14206865"
cmake = "3.22.1"

# Kotlin
kotlin = "2.1.0"
coroutines = "1.9.0"

# AndroidX
core-ktx = "1.15.0"
appcompat = "1.7.0"
activity-compose = "1.9.3"
androidx-lifecycle = "2.8.7"
navigation-compose = "2.8.5"
preference-ktx = "1.2.1"
startup-runtime = "1.2.0"
compose-bom = "2024.12.01"
accompanist-drawablepainter = "0.37.3"
accompanist-permissions = "0.37.3"

# Audio
aap-core = "0.11.2"
oboe = "1.11.0"
ktmidi = "0.12.0"
compose-audio-controls = "0.7.3"

# Testing
junit = "4.13.2"
test-ext-junit = "1.2.1"
espresso = "3.6.1"

# Publishing
dokka = "1.9.20"
vanniktech-maven-publish = "0.30.0"

[libraries]

# Kotlin
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidx-lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference-ktx" }
startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startup-runtime" }
accompanist-drawablepainter = { module = "com.google.accompanist:accompanist-drawablepainter", version.ref = "accompanist-drawablepainter" }
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist-permissions" }

# Compose (versions from the BOM)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Audio
oboe = { module = "com.google.oboe:oboe", version.ref = "oboe" }
libcxx-provider = { module = "dev.atsushieno:libcxx-provider", version.ref = "ndk" }
ktmidi = { module = "dev.atsushieno:ktmidi", version.ref = "ktmidi" }
compose-audio-controls = { module = "org.androidaudioplugin:compose-audio-controls", version.ref = "compose-audio-controls" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
